<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text y=%22.9em%22 font-size=%2290%22 fill=%22white%22>P</text></svg>">
    <title>NISN SDS IT MAdani Kayuagung</title>
  </head>
  <body>
    <div id="root">
      <div id="fallback-message" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #64748b; text-align: center; padding: 20px;">
        <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 8px;">NISN Search Pro</div>
        <div>Memuat aplikasi...</div>
        <div id="error-display" style="margin-top: 20px; color: #ef4444; font-size: 0.8rem; font-family: monospace; white-space: pre-wrap; max-width: 80vw;"></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var errorDisplay = document.getElementById('error-display');
        if (errorDisplay) {
          errorDisplay.textContent = 'Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errorDisplay = document.getElementById('error-display');
        if (errorDisplay) {
          errorDisplay.textContent = 'Promise Error: ' + e.reason;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
